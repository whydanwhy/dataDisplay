<!DOCTYPE html>
<html>
<head>
    <title>Log Query Tool</title>
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
    <script>window.onload = () => {
    const now = new Date();
    const earlier = new Date(now.getTime() - 60 * 60 * 1000); // last hour

    document.getElementById("endTime").value = now.toISOString().slice(0,16);
    document.getElementById("startTime").value = earlier.toISOString().slice(0,16);
    refreshSavedQueries();
};</script>


</head>
<body>

<h2>Log Query</h2>
<!-- Save query-->
<div style="margin-bottom:10px;">
    <button onclick="saveQuery()">Save Query</button>

    <select id="savedQueries" onchange="loadSavedQuery()">
        <option value="">-- Saved Queries --</option>
    </select>

    <button onclick="deleteSavedQuery()">Delete</button>
</div>
<div id="editor" style="height: 200px; border: 1px solid #ccc;"></div>
<!-- Editor-->
<div style="margin-bottom:10px;">
    <label>Time Range:</label>
    <select id="timeRange" onchange="runQuery()">
        <option value="none">All</option>
        <option value="15m">Last 15 min</option>
        <option value="1h">Last 1 hour</option>
        <option value="24h">Last 24 hours</option>
    </select>
</div>
<div style="margin-bottom:10px;">
    <label>From:</label>
    <input type="datetime-local" id="startTime">

    <label>To:</label>
    <input type="datetime-local" id="endTime">

    <button onclick="clearTimeRange()">Clear</button>
</div>
<button onclick="runQuery()">Run Query</button>

<h3>Results</h3>
<div style="margin-bottom:10px;">
    <label>Level:</label>
    <select id="filterLevel" onchange="applyFilters()">
        <option value="">All</option>
    </select>

    <label>Service:</label>
    <select id="filterService" onchange="applyFilters()">
        <option value="">All</option>
    </select>

    <label>Search:</label>
    <input type="text" id="searchBox" oninput="applyFilters()" placeholder="Search...">
</div>
<table border="1" id="results"></table>



<h3> Error Trend (Per hour)</h3>
<div id="errorChart" style="height:300px;"></div>

    <script src="/static/app.js"></script>
    
    <script>
    console.log("INLINE TEST - Chart:", typeof Chart);
    </script>

    <script src="/static/chart.js"></script>

<script>
    console.log("Chart test:", typeof Chart);
</script>
<script src="/static/app.js"></script>
</body>
</html>
